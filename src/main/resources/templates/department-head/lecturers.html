<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head('Giảng viên Khoa')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopicHub</title>
</head>
<body class="workspace-page">

    <!-- Left Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar('lecturers', ${user})}"></aside>

    <!-- Main Wrapper -->
    <div class="saas-main-wrapper">
        <!-- Topbar -->
        <header th:replace="~{fragments/topbar :: topbar('Danh sách Giảng viên', ${user != null && user.role != null ? user.role.name : 'Trưởng Khoa'}, '/department-head/dashboard', ${user})}"></header>

        <!-- Main Content View -->
        <main class="saas-content">

            <!-- Page Header -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
                <div class="d-flex align-items-center gap-2">
                    <h1 class="text-lg font-bold text-slate-900 mb-0">Danh Sách Giảng Viên</h1>
                    <span class="badge-pill-neutral font-semibold text-xs text-blue-700 bg-blue-50 border-blue-200" th:text="${department != null ? department.name : 'Khoa CNTT'}">Khoa CNTT</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span id="filteredRowCount" class="badge-pill-neutral font-medium text-xs" th:text="'Tổng số: ' + ${#lists.size(lecturers)} + ' giảng viên'"></span>
                </div>
            </div>

            <!-- Universal 1-Row Toolbar -->
            <div class="saas-card p-3 mb-4 workspace-filterbar">
                <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
                    <div class="relative flex-grow-1 max-w-md">
                        <input type="text" class="form-control form-control-sm rounded-xl pl-8 text-xs" placeholder="Tìm kiếm theo tên giảng viên, mã GV, email..." onkeyup="filterTableByKeyword(this.value)" title="Tìm kiếm theo tên giảng viên, mã GV, email..." aria-label="Tìm kiếm theo tên giảng viên, mã GV, email...">
                        <i class="fa-solid fa-magnifying-glass text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2 text-xs"></i>
                    </div>
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <select class="form-select form-select-sm rounded-xl text-xs" style="width: 200px;" onchange="filterTableByAttribute('academic', this.value)" title="Lựa chọn" aria-label="Lựa chọn">
                            <option value="all">-- Tất cả học hàm / học vị --</option>
                            <option value="PGS">PGS.TS / Phó Giáo Sư</option>
                            <option value="TS">TS / Tiến sĩ</option>
                            <option value="ThS">ThS / Thạc sĩ</option>
                        </select>
                        <button type="button" class="btn btn-sm btn-light border border-slate-200 rounded-xl px-2.5 text-slate-600 hover:bg-slate-100" onclick="filterTableByKeyword(''); filterTableByAttribute('academic', 'all'); document.querySelector('select').value='all';" title="Đặt lại bộ lọc">
                            <i class="fa-solid fa-rotate-left text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Lecturers Table with Overflow Protection -->
            <div class="table-saas-container mb-4">
                <div class="w-full overflow-x-auto">
                    <table class="table table-saas mb-0">
                        <thead>
                            <tr>
                                <th style="width: 28%;" scope="col">Giảng viên</th>
                                <th style="width: 14%;" scope="col">Mã GV</th>
                                <th style="width: 18%;" scope="col">Học hàm / Học vị</th>
                                <th style="width: 20%;" scope="col">Email & Liên hệ</th>
                                <th style="width: 20%;" scope="col">Chỉ tiêu hướng dẫn</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${lecturers == null or lecturers.isEmpty()}">
                                <td colspan="5" class="text-center py-5 text-muted text-xs">
                                    <i class="fa-regular fa-folder-open text-2xl mb-2 d-block text-slate-300"></i>
                                    Chưa có danh sách giảng viên trong khoa.
                                </td>
                            </tr>
                            <tr th:each="l : ${lecturers}" class="filterable-row" th:data-academic="${l.academicTitle != null ? l.academicTitle : ''}">
                                <td>
                                    <div class="d-flex align-items-center gap-2.5">
                                        <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 font-bold flex items-center justify-center text-xs flex-shrink-0" th:text="${l.user != null and l.user.fullName != null and !l.user.fullName.isEmpty() ? l.user.fullName.substring(0, 1) : 'G'}">G</div>
                                        <div>
                                            <div class="font-bold text-slate-900 text-xs line-clamp-1" th:text="${l.user != null ? l.user.fullName : 'Giảng viên'}">TS. Nguyễn Văn A</div>
                                            <span class="text-slate-400 text-xs truncate-cell" th:text="${l.department != null ? l.department.name : 'Khoa CNTT'}">Khoa CNTT</span>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge bg-slate-100 text-slate-800 border border-slate-200 text-xs px-2 py-0.5 rounded-md font-mono font-semibold" th:text="${l.lecturerCode}">GV001</span>
                                </td>
                                <td>
                                    <span class="font-medium text-slate-900 text-xs" th:text="${(l.academicTitle != null ? l.academicTitle : '') + (l.degree != null ? ' - ' + l.degree : '')}">TS - Tiến sĩ</span>
                                </td>
                                <td>
                                    <div class="text-slate-800 text-xs truncate-cell" th:text="${l.user != null ? l.user.email : ''}">email@edu.vn</div>
                                    <span class="text-slate-400 text-xs font-mono" th:text="${l.user != null and l.user.phone != null ? l.user.phone : ''}">0905123456</span>
                                </td>
                                <td>
                                    <span class="badge-pill-neutral font-bold text-xs" th:text="'Tối đa ' + ${l.maxTopicsQuota} + ' đề tài'">Tối đa 5 đề tài</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts Fragment -->
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
