        <style>
            /* ===== BLACK DOT DESKTOP VIRTUAL PET CONTAINER ===== */
            .black-dot-pet-container {
                position: fixed;
                bottom: 1.5rem;
                right: 1.75rem;
                z-index: 1060;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                -webkit-user-select: none;
            user-select: none;
                cursor: pointer;
                touch-action: none;
            }

            .black-dot-pet-container.is-dragging {
                cursor: grabbing !important;
                transition: none !important;
            }

            .black-dot-pet-container.is-dragging .black-dot-sprite {
                transform: scale(1.1) rotate(5deg) !important;
                filter: drop-shadow(0 15px 25px rgba(15, 23, 42, 0.35)) !important;
            }

            /* Cute Dynamic Speech Bubble */
            .black-dot-speech-bubble {
                background: #0f172a;
                color: #f8fafc;
                font-size: 0.75rem;
                font-weight: 600;
                padding: 7px 14px;
                border-radius: 16px;
                box-shadow: 0 10px 25px -4px rgba(15, 23, 42, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08);
                border: 1px solid #334155;
                margin-bottom: 6px;
                cursor: pointer;
                position: relative;
                animation: petBubbleFloat 3.5s infinite ease-in-out;
                transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
                white-space: nowrap;
                max-width: 260px;
                text-align: center;
            }

            .black-dot-speech-bubble::after {
                content: '';
                position: absolute;
                bottom: -5px;
                right: 38px;
                width: 10px;
                height: 10px;
                background: #0f172a;
                border-right: 1px solid #334155;
                border-bottom: 1px solid #334155;
                transform: rotate(45deg);
            }

            .black-dot-speech-bubble:hover {
                transform: scale(1.06) translateY(-2px);
                background: #1e293b;
                border-color: #3b82f6;
                color: #60a5fa;
                box-shadow: 0 12px 28px -4px rgba(59, 130, 246, 0.45);
            }

            @keyframes petBubbleFloat {

                0%,
                100% {
                    transform: translateY(0);
                }

                50% {
                    transform: translateY(-5px);
                }
            }

            /* Sleeping Zzz */
            .black-dot-zzz {
                position: absolute;
                top: -18px;
                left: 10px;
                font-weight: 800;
                color: #60a5fa;
                font-family: monospace;
                pointer-events: none;
            }

            .black-dot-zzz span {
                display: inline-block;
                animation: zzzFly 2s infinite linear;
                opacity: 0;
            }

            .black-dot-zzz span:nth-child(1) {
                font-size: 11px;
                animation-delay: 0s;
            }

            .black-dot-zzz span:nth-child(2) {
                font-size: 14px;
                animation-delay: 0.6s;
            }

            .black-dot-zzz span:nth-child(3) {
                font-size: 17px;
                animation-delay: 1.2s;
            }

            @keyframes zzzFly {
                0% {
                    opacity: 0;
                    transform: translate(0, 0) scale(0.6);
                }

                50% {
                    opacity: 1;
                    transform: translate(-8px, -12px) scale(1);
                }

                100% {
                    opacity: 0;
                    transform: translate(-16px, -24px) scale(1.3);
                }
            }

            /* Floating Heart / Reaction Particles */
            .black-dot-particles {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                overflow: visible;
            }

            .pet-particle {
                position: absolute;
                font-size: 18px;
                animation: particleFloatUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                pointer-events: none;
            }

            @keyframes particleFloatUp {
                0% {
                    opacity: 1;
                    transform: translateY(0) scale(0.6) rotate(0deg);
                }

                50% {
                    opacity: 1;
                    transform: translateY(-28px) scale(1.2) rotate(12deg);
                }

                100% {
                    opacity: 0;
                    transform: translateY(-55px) scale(0.9) rotate(-15deg);
                }
            }

            /* Black Dot Character Sprite */
            .black-dot-pet {
                width: 96px;
                height: 104px;
                position: relative;
                cursor: pointer;
                transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
                transform-origin: bottom center;
            }

            .black-dot-sprite {
                width: 100%;
                height: 100%;
                object-fit: contain;
                filter: drop-shadow(0 8px 18px rgba(15, 23, 42, 0.4));

            // Mascot Sprite Assets
            const MASCOT_SPRITES = window.REAL_MASCOT_ASSETS;

            // Preload Mascot Sprites
            Object.values(MASCOT_SPRITES).forEach(src => {
                const img = new Image();

            });

            const blackDotQuotes = [
                "Meow! Cần Black Dot soi đồ án hộ không? 🐾",
                "Đang code đồ án hả? Có bug gọi Black Dot nhé!",
                "Deadline KLTN sắp tới rồi, nhóm làm tới đâu rồi? ✨",
                "Gâu... à nhầm, Meow! Tớ là Black Dot AI siêu ngầu 🐾",
                "Click vào tớ để tra điểm hoặc tìm đề tài nha!",
                "Hôm nay nhớ nộp báo cáo tiến độ đúng hạn đấy nhé!"
            ];

            // Change Mascot Sprite
            function setPetSprite(spriteKey) {
                const img = document.getElementById('blackDotImg');
                if (img && MASCOT_SPRITES[spriteKey]) {
                    img.onerror = function() {
                        this.onerror = null;
                        this.src = window.BLACK_DOT_FALLBACK;
                    };
                    img.src = MASCOT_SPRITES[spriteKey];
                }

            // Spawn floating emojis (+1, 💖, ✨, 🐾)
            function spawnPetParticle(emoji) {
                const container = document.getElementById('blackDotParticles');
                if (!container) return;
                const p = document.createElement('span');
                p.className = 'pet-particle';
                p.innerText = emoji || '💖';
                p.style.left = (30 + Math.random() * 35) + 'px';
                p.style.top = (10 + Math.random() * 20) + 'px';
                container.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }

            // Initialize Virtual Pet Engine on DOM loaded
            document.addEventListener('DOMContentLoaded', () => {
                startBlackDotPetEngine();
                initDraggableAiWidget();
            });

            function startBlackDotPetEngine() {
                const pet = document.getElementById('blackDotPetCharacter');
                const bubble = document.getElementById('blackDotSpeechBubble');
                const speechText = document.getElementById('blackDotSpeechText');
                const zzz = document.getElementById('blackDotZzz');
                if (!pet) return;

                // 1. Hover Listener: Wake up, wave paw & hop!
                pet.addEventListener('mouseenter', () => {
                    clearPetActionClasses();
                    if (zzz) zzz.classList.add('d-none');
                    isPetSleeping = false;

                    // Switch to joyful wave sprite
                    setPetSprite('wave');
                    pet.classList.add('pet-hopping');
                    spawnPetParticle(['💖', '🐾', '✨', '😻'][Math.floor(Math.random() * 4)]);

                    setTimeout(() => {
                        pet.classList.remove('pet-hopping');
                        setPetSprite('idle');
                    }, 750);

                    // Show snappy quote
                    if (speechText && bubble) {
                        const randomQuote = blackDotQuotes[Math.floor(Math.random() * blackDotQuotes.length)];
                        speechText.innerText = randomQuote;
                        bubble.style.opacity = '1';
                        bubble.style.transform = 'scale(1.05)';
                    }
                });

                pet.addEventListener('mouseleave', () => {
                    if (bubble) {
                        bubble.style.transform = 'scale(1)';
                    }
                });

                // 2. Periodic Autonomous Pet Behaviors (Walk, Hop, Smart Glasses, Sleep)
                if (petActionTimer) clearInterval(petActionTimer);
                petActionTimer = setInterval(() => {
                    if (isAiChatOpen) return; // Stay still while chat is open

                    const rand = Math.random();
                    clearPetActionClasses();

                    if (rand < 0.28) {
                        // Action 1: Walk / Patrol with playful hops
                        pet.classList.add('pet-walking');
                        if (zzz) zzz.classList.add('d-none');
                        setTimeout(() => pet.classList.remove('pet-walking'), 3200);
                    } else if (rand < 0.55) {
                        // Action 2: Wave & Hop
                        setPetSprite('wave');
                        pet.classList.add('pet-hopping');
                        if (zzz) zzz.classList.add('d-none');
                        spawnPetParticle('✨');
                        setTimeout(() => {
                            pet.classList.remove('pet-hopping');
                            setPetSprite('idle');
                        }, 750);
                    } else if (rand < 0.80) {
                        // Action 3: Push Glasses (Smart pose)
                        setPetSprite('smart');
                        pet.classList.add('pet-smart');
                        if (zzz) zzz.classList.add('d-none');
                        if (speechText) speechText.innerText = "Black Dot đang phân tích đồ án... 👓✨";
                        setTimeout(() => {
                            pet.classList.remove('pet-smart');
                            setPetSprite('idle');
                        }, 3200);
                    } else {
                        // Action 4: Sleepy Zzz
                        pet.classList.add('pet-sleeping');
                        if (zzz) zzz.classList.remove('d-none');
                        isPetSleeping = true;
                    }
                }, 8500);

                // 3. Periodic Random Bubble Quotes
                if (petSpeechTimer) clearInterval(petSpeechTimer);
                petSpeechTimer = setInterval(() => {
                    if (isAiChatOpen || isPetSleeping) return;
                    if (speechText) {
                        const randomQuote = blackDotQuotes[Math.floor(Math.random() * blackDotQuotes.length)];
                        speechText.innerText = randomQuote;
                    }
                }, 12000);
            }

            function clearPetActionClasses() {
                const pet = document.getElementById('blackDotPetCharacter');
                if (!pet) return;
                pet.classList.remove('pet-walking', 'pet-hopping', 'pet-smart', 'pet-sleeping');
            }

            function handlePetClick(e) {
                if (e) {
                    e.stopPropagation();
                }
                const petContainer = document.getElementById('blackDotPetContainer');
                if (petContainer && petContainer.dataset.justDragged === 'true') {
                    return;
                }
                clearPetActionClasses();
                const pet = document.getElementById('blackDotPetCharacter');
                const zzz = document.getElementById('blackDotZzz');
                if (zzz) zzz.classList.add('d-none');
                isPetSleeping = false;

                // Click excitement
                setPetSprite('wave');
                spawnPetParticle('😻');
                if (pet) {
                    pet.classList.add('pet-hopping');
                    setTimeout(() => {
                        pet.classList.remove('pet-hopping');
                        setPetSprite('smart');
                    }, 700);
                }
                toggleAiChat();
            }

            // ===== DRAGGABLE ENGINE FOR PET MASCOT & CHAT WINDOW =====
            function setupDraggableElement(element, handle, storageKeyPrefix) {
                if (!element || !handle) return;

                let isDragging = false;
                let hasMoved = false;
                let startX = 0, startY = 0;
                let initialLeft = 0, initialTop = 0;

                function onPointerDown(e) {
                    if (e.type === 'mousedown' && e.button !== 0) return;
                    if (e.target.closest('button, input, a, textarea')) return;

                    isDragging = true;
                    hasMoved = false;

                    const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
                    const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;

                    startX = clientX;
                    startY = clientY;

                    const rect = element.getBoundingClientRect();
                    initialLeft = rect.left;
                    initialTop = rect.top;

                    document.addEventListener('mousemove', onPointerMove, { passive: false });
                    document.addEventListener('mouseup', onPointerUp);
                    document.addEventListener('touchmove', onPointerMove, { passive: false });
                    document.addEventListener('touchend', onPointerUp);
                }

                function onPointerMove(e) {
                    if (!isDragging) return;

                    const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
                    const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;

                    const deltaX = clientX - startX;
                    const deltaY = clientY - startY;

                    if (Math.abs(deltaX) > 8 || Math.abs(deltaY) > 8) {
                        hasMoved = true;
                        if (e.cancelable) e.preventDefault();
                        element.style.bottom = 'auto';
                        element.style.right = 'auto';
                        element.classList.add('is-dragging');

                        let newLeft = initialLeft + deltaX;
                        let newTop = initialTop + deltaY;

                        const maxLeft = window.innerWidth - element.offsetWidth;
                        const maxTop = window.innerHeight - element.offsetHeight;

                        newLeft = Math.max(10, Math.min(newLeft, maxLeft - 10));
                        newTop = Math.max(10, Math.min(newTop, maxTop - 10));

                        element.style.left = newLeft + 'px';
                        element.style.top = newTop + 'px';
                    }
                }

                function onPointerUp(e) {
                    if (!isDragging) return;
                    isDragging = false;
                    element.classList.remove('is-dragging');

                    document.removeEventListener('mousemove', onPointerMove);
                    document.removeEventListener('mouseup', onPointerUp);
                    document.removeEventListener('touchmove', onPointerMove);
                    document.removeEventListener('touchend', onPointerUp);

                    if (hasMoved) {
                        element.dataset.justDragged = 'true';
                        setTimeout(() => { delete element.dataset.justDragged; }, 150);
                    }
                }

                handle.addEventListener('mousedown', onPointerDown);
                handle.addEventListener('touchstart', onPointerDown, { passive: true });
            }

            function initDraggableAiWidget() {
                // Clear any legacy localStorage coords that pinned pet to left
                try {
                    localStorage.removeItem('black_dot_pet_left');
                    localStorage.removeItem('black_dot_pet_top');
                    localStorage.removeItem('black_dot_chat_left');
                    localStorage.removeItem('black_dot_chat_top');
                } catch (e) {}

                const petContainer = document.getElementById('blackDotPetContainer');
                const petCharacter = document.getElementById('blackDotPetCharacter');
                const chatWindow = document.getElementById('aiChatWindow');
                const chatHeader = chatWindow ? chatWindow.querySelector('.ai-chat-header') : null;

                if (petContainer && petCharacter) {
                    setupDraggableElement(petContainer, petCharacter, 'black_dot_pet');
                }
                if (chatWindow && chatHeader) {
                    setupDraggableElement(chatWindow, chatHeader, 'black_dot_chat');
                }
            }

            function toggleAiChat() {
                const win = document.getElementById('aiChatWindow');
                if (!win) return;

                isAiChatOpen = !isAiChatOpen;
                if (isAiChatOpen) {
                    win.classList.remove('d-none');
                    setPetSprite('smart');
                    document.getElementById('aiChatInput')?.focus();
                } else {
                    win.classList.add('d-none');
                    setPetSprite('idle');
                }

                    box.innerHTML = `
                        <div class="ai-msg-row ai-msg-bot">

                                <span class="text-[10px] text-slate-400">Bây giờ</span>
                            </div>
                        </div>
                    `;
                }

            function renderAiMarkdown(text) {
                if (!text) return '';
                // Simple fast markdown parser for bold, italic, code, bullets, line breaks
                let html = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/`(.*?)`/g, '<code class="px-1 py-0.5 bg-slate-200 dark:bg-slate-800 text-blue-700 dark:text-blue-400 rounded text-[11px] font-mono">$1</code>')
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" class="text-blue-600 dark:text-blue-400 font-semibold underline hover:text-blue-700">$1</a>')
                    .replace(/\n/g, '<br>');
                return html;
            }

            async function handleAiChatSubmit(e) {
                if (e && e.preventDefault) e.preventDefault();

                const input = document.getElementById('aiChatInput');
                const msgBox = document.getElementById('aiChatMessages');
                const typing = document.getElementById('aiTypingIndicator');
                const sugBox = document.getElementById('aiSuggestionsBox');
                if (!input || !input.value.trim()) return;

                const userMsg = input.value.trim();
                input.value = '';

                // 1. Append User Message
                const userRow = document.createElement('div');
                userRow.className = 'ai-msg-row ai-msg-user';
                userRow.innerHTML = `
                    <div class="ai-msg-bubble">
                        <p class="mb-1 text-xs">${userMsg}</p>
                        <span class="text-[10px] text-blue-100">Bây giờ</span>
                    </div>
                `;
                msgBox.appendChild(userRow);
                msgBox.scrollTop = msgBox.scrollHeight;

                // 2. Show Typing Indicator & Pet Smart Sprite
                setPetSprite('smart');
                if (typing) typing.classList.remove('d-none');
                msgBox.scrollTop = msgBox.scrollHeight;

                try {
                    const res = await fetch('/api/ai/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userMsg })
                    });
                    if (!res.ok) {
                        throw new Error('Server returned ' + res.status);
                    }
                    const data = await res.json();
                    if (!data || !data.reply) {
                        throw new Error('Empty reply');
                    }

                    // Hide typing
                    if (typing) typing.classList.add('d-none');

                    // 3. Append Bot Message
                    const botRow = document.createElement('div');
                    botRow.className = 'ai-msg-row ai-msg-bot';
                    botRow.innerHTML = `
                        <div class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-700 text-white flex items-center justify-center flex-shrink-0 p-0.5 shadow-xs overflow-hidden">
                            <img src="/images/mascot/black_dot_smart.png" alt="Black Dot" class="w-full h-full object-contain" />
                        </div>
                        <div class="ai-msg-bubble">
                            <div class="text-xs mb-1">${renderAiMarkdown(data.reply)}</div>
                            <span class="text-[10px] text-slate-400">Bây giờ</span>
                        </div>
                    `;
                    msgBox.appendChild(botRow);
                    msgBox.scrollTop = msgBox.scrollHeight;

                    // 4. Update Suggestions
                    if (sugBox && data.suggestions && data.suggestions.length > 0) {
                        sugBox.innerHTML = data.suggestions
                            .map(s => `<button type="button" class="ai-chip" onclick="sendAiQuickPrompt('${s.replace(/'/g, "\\'")}')">${s}</button>`)
                            .join('');
                    }
                } catch (err) {
                    if (typing) typing.classList.add('d-none');
                    const errRow = document.createElement('div');
                    errRow.className = 'ai-msg-row ai-msg-bot';
                    errRow.innerHTML = `
                        <div class="w-8 h-8 rounded-xl bg-rose-500 text-white flex items-center justify-center flex-shrink-0 text-xs shadow-xs">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div class="ai-msg-bubble">
                            <p class="text-xs text-rose-600 mb-0">Đã xảy ra lỗi khi kết nối với Black Dot AI. Vui lòng thử lại sau!</p>
                        </div>
                    `;
                    msgBox.appendChild(errRow);
                    msgBox.scrollTop = msgBox.scrollHeight;
                }
            }
        </script>
    </div>
</body>

</html>
