server.port=8082

# Spring Profiles (Chapter 05 Slide 32: Environment separation)
spring.profiles.active=dev

# Cấu hình chuẩn kết nối Neon PostgreSQL (Hỗ trợ biến môi trường CI/CD & Production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-crimson-darkness-azvyzksi-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_BuN3rckyjlT0}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_batch_fetch_size=30
spring.jpa.open-in-view=true

# HikariCP Configuration (Tối ưu kết nối Neon Pooler)
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=15000

# Tinh chỉnh Tomcat Worker Threads (Đồng bộ tỉ lệ với Neon Hikari Connection Pool 15)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

# Spring Boot Actuator Endpoints & Metrics
management.endpoints.web.exposure.include=health,info,metrics,hikaricp
management.endpoint.health.show-details=always
management.endpoint.metrics.access=read_only

# Bật nén HTTP GZIP (giảm dung lượng HTML/JSON/CSS/JS truyền qua mạng từ 70-80%)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=512

# Cấu hình cache cho tài nguyên tĩnh và trình duyệt
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.period=86400
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# Giới hạn dung lượng upload
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Cấu hình Google OAuth 2.0 (Đăng nhập Email Sinh viên)
google.oauth2.client-id=${GOOGLE_OAUTH_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
google.oauth2.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
google.oauth2.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8082/auth/google/callback}
app.auth.student-email-domains=

# Cấu hình Spring Mail (Gửi email công bố kết quả cho sinh viên theo Rubric)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-mail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Thymeleaf Live Reload (Đọc trực tiếp từ ổ đĩa file:src/... để mỗi khi sửa HTML chỉ cần F5 là nhận ngay, không cần restart server)
spring.thymeleaf.prefix=${SPRING_THYMELEAF_PREFIX:file:src/main/resources/templates/}
spring.thymeleaf.cache=false
spring.web.resources.static-locations=${SPRING_STATIC_LOCATIONS:file:src/main/resources/static/,classpath:/static/}

